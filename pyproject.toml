[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loomset"
version = "0.1.0"
description = "MVP dataset pipeline for discovery, scraping, extraction, cleaning, labeling, and export"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckduckgo-search>=6.3.0",
  "pydantic>=2.8.2",
  "typer>=0.12.3",
  "sqlalchemy>=2.0.31",
  "pandas>=2.2.3",
  "pyarrow>=17.0.0",
  "trafilatura>=1.12.0",
  "datasets>=2.19.1",
  "langdetect>=1.0.9",
  "rapidfuzz>=3.3.0",
  "requests>=2.32.0",
  "PyYAML>=6.0.1",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "pytest>=8.3.2",
]

[project.scripts]
loomset = "loomset.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
